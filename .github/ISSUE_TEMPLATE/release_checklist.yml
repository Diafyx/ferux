name: Release checklist
description: Track one version from finished scope to a verified release.
title: "release: "
labels: ["maintenance", "release"]
type: Task
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or wrong today.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why this matters, and who it helps.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: The approach, in a few sentences.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: The concrete changes, as a list.
      value: |
        - All other issues in the milestone are closed.
        - A release preparation pull request: version numbers, `CHANGELOG.md` in the Keep a Changelog format, and supported platforms.
        - CI review: the job matrix matches the supported platforms, Dependabot updates are merged, the required checks match the job names, and no checks are skipped.
        - The signed tag is created and pushed, and the release workflow publishes the release.
        - Verification: download the release image, check its checksum and attestation, and boot it in QEMU.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable results that show the work is done.
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: What this issue does not cover.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Issues that must be finished first, or None.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Risk and rollback
      description: What could go wrong, and how to undo the change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, and why they were not chosen.
    validations:
      required: true
